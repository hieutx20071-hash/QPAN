<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="description" content="Ôn tập kiến thức về các quân, binh chủng QĐND Việt Nam">
  <meta name="theme-color" content="#c62828">
  <title>Ôn Tập Kiến Thức: Các Quân, Binh Chủng QĐND Việt Nam</title>
  <style>
    :root {
      /* Primary Colors */
      --primary: #c62828;
      --primary-dark: #8e0000;
      --primary-light: #ef5350;
      --gold: #ffd600;
      --gold-dark: #c79100;
      --military-green: #2e7d32;
      --military-dark: #1b5e20;
      --military-light: #4caf50;
      
      /* UI Colors */
      --bg-card: rgba(255, 255, 255, 0.95);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      
      /* Shadows */
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 16px 36px rgba(0, 0, 0, 0.16);
      
      /* Radius */
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      
      /* Font */
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: "Fira Code", "Courier New", monospace;
      
      /* Transitions */
      --transition-fast: 0.15s ease;
      --transition-normal: 0.25s ease;
      --transition-slow: 0.35s ease;
    }

    /* Dark Mode Support */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-card: rgba(30, 41, 59, 0.95);
        --text-main: #f8fafc;
        --text-muted: #cbd5e1;
        --border-color: #334155;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
      overflow-x: hidden;
    }

    body {
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 90px;
      overflow-x: hidden;
      position: relative;
      background: linear-gradient(to bottom, rgba(241, 245, 249, 0.86), rgba(226, 232, 240, 0.92));
      min-height: 100vh;
      transition: background var(--transition-slow);
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: linear-gradient(to bottom, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.98));
      }
    }

    /* Confetti Canvas */
    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    /* Header Banner */
    header {
      background: linear-gradient(135deg, rgba(127, 0, 0, 0.94) 0%, rgba(183, 28, 28, 0.9) 50%, rgba(27, 94, 32, 0.94) 100%);
      background-size: cover;
      color: #ffffff;
      padding: 34px 16px 28px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
      border-bottom: 3.5px solid var(--gold);
      position: relative;
      animation: slideDown var(--transition-normal);
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
    }

    .header-top-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 214, 0, 0.6);
      padding: 5px 18px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.6px;
      text-transform: uppercase;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      animation: fadeInUp 0.5s ease 0.1s both;
    }

    .star-icon {
      color: var(--gold);
      font-size: 1.15rem;
      filter: drop-shadow(0 0 4px rgba(255, 214, 0, 0.8));
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.1); }
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 900;
      letter-spacing: -0.4px;
      line-height: 1.25;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      animation: fadeInUp 0.5s ease 0.2s both;
    }

    @media (min-width: 768px) {
      h1 { font-size: 2.2rem; }
    }

    .header-desc {
      font-size: 0.96rem;
      color: #f8fafc;
      max-width: 720px;
      opacity: 0.96;
      font-weight: 400;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
      animation: fadeInUp 0.5s ease 0.3s both;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Main Container */
    .main-container {
      max-width: 960px;
      margin: 20px auto 0;
      padding: 0 16px;
    }

    /* Sticky Control Panel */
    .sticky-control-wrapper {
      position: sticky;
      top: 10px;
      z-index: 120;
      margin-bottom: 22px;
      transition: all var(--transition-normal);
    }

    .sticky-control-panel {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: var(--radius-md);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.14);
      border: 1.5px solid rgba(198, 40, 40, 0.25);
      padding: 14px 18px;
      animation: slideDown var(--transition-normal);
    }

    @media (prefers-color-scheme: dark) {
      .sticky-control-panel {
        background: rgba(30, 41, 59, 0.96);
        border-color: rgba(198, 40, 40, 0.5);
      }
    }

    .sticky-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .sticky-stat-group {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .sticky-stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-icon-circle {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      color: var(--primary);
      border: 1px solid #cbd5e1;
      transition: all var(--transition-fast);
    }

    .stat-icon-circle:hover {
      transform: scale(1.08);
      box-shadow: 0 2px 8px rgba(198, 40, 40, 0.15);
    }

    .stat-text-label {
      font-size: 0.76rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-muted);
      line-height: 1.1;
    }

    .stat-text-val {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.2;
    }

    .sticky-actions-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-quick-submit {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #ffffff;
      border: none;
      border-radius: 20px;
      padding: 8px 18px;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 3px 10px rgba(198, 40, 40, 0.3);
      transition: all var(--transition-normal);
      white-space: nowrap;
      user-select: none;
    }

    .btn-quick-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(198, 40, 40, 0.4);
    }

    .btn-quick-submit:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(198, 40, 40, 0.3);
    }

    .btn-toggle-palette {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all var(--transition-normal);
      user-select: none;
    }

    .btn-toggle-palette:hover {
      background: #e2e8f0;
      border-color: #94a3b8;
    }

    .btn-toggle-palette:active {
      transform: scale(0.96);
    }

    /* Progress Track */
    .sticky-progress-track {
      width: 100%;
      height: 7px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
      margin: 10px 0;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .sticky-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2e7d32, #43a047, #ffd600);
      border-radius: 4px;
      transition: width var(--transition-slow) cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 8px rgba(45, 212, 191, 0.4);
    }

    /* Palette Navigator */
    .sticky-palette-body {
      transition: max-height var(--transition-normal), opacity var(--transition-normal);
      overflow: hidden;
    }

    .sticky-palette-body.collapsed {
      max-height: 0;
      opacity: 0;
      margin-top: 0;
    }

    .sticky-palette-body:not(.collapsed) {
      max-height: 200px;
      opacity: 1;
    }

    .palette-legend-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .legend-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .legend-dot-sq {
      width: 10px;
      height: 10px;
      border-radius: 3px;
    }

    .dot-unanswered { background: #ffffff; border: 1px solid #94a3b8; }
    .dot-answered { background: var(--military-green); }
    .dot-correct { background: #16a34a; }
    .dot-wrong { background: #dc2626; }
    .dot-skipped { background: #f59e0b; }

    .palette-grid-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
      gap: 6px;
    }

    .p-btn {
      height: 36px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      color: #334155;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
      user-select: none;
    }

    .p-btn:hover {
      background: #f1f5f9;
      border-color: #64748b;
      transform: translateY(-1px);
    }

    .p-btn:focus {
      outline: 2px solid var(--primary);
      outline-offset: 1px;
    }

    .p-btn.answered {
      background: linear-gradient(135deg, var(--military-green), #1b5e20);
      color: #ffffff;
      border-color: #1b5e20;
      box-shadow: 0 2px 4px rgba(46, 125, 50, 0.25);
    }

    .p-btn.current-target {
      outline: 2.5px solid var(--primary);
      outline-offset: 1px;
      box-shadow: 0 0 12px rgba(198, 40, 40, 0.3);
    }

    .p-btn.res-correct {
      background: #16a34a !important;
      color: #ffffff !important;
      border-color: #15803d !important;
    }

    .p-btn.res-wrong {
      background: #dc2626 !important;
      color: #ffffff !important;
      border-color: #b91c1c !important;
    }

    .p-btn.res-skipped {
      background: #f59e0b !important;
      color: #ffffff !important;
      border-color: #d97706 !important;
    }

    /* Result Dashboard */
    .result-section {
      display: none;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(16px);
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-lg);
      border: 2px solid #22c55e;
      position: relative;
      animation: popIn 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .result-section.active {
      display: block;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.96) translateY(-10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .result-title-bar {
      text-align: center;
      margin-bottom: 18px;
    }

    .result-badge {
      display: inline-block;
      padding: 6px 22px;
      border-radius: 30px;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.3px;
      margin-top: 10px;
      transition: all var(--transition-normal);
    }

    .result-badge:hover {
      transform: scale(1.05);
    }

    .badge-gold { background: #fef08a; color: #854d0e; border: 1.5px solid #facc15; }
    .badge-green { background: #dcfce7; color: #166534; border: 1.5px solid #86efac; }
    .badge-blue { background: #e0f2fe; color: #075985; border: 1.5px solid #7dd3fc; }
    .badge-amber { background: #fef3c7; color: #92400e; border: 1.5px solid #fcd34d; }
    .badge-red { background: #fee2e2; color: #991b1b; border: 1.5px solid #fca5a5; }

    .score-visual-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 16px 0;
    }

    .score-donut {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: conic-gradient(#16a34a 0%, #16a34a 0%, #e2e8f0 0%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-md);
      transition: background var(--transition-slow);
    }

    .score-donut-hole {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .score-number {
      font-size: 2.3rem;
      font-weight: 900;
      color: #0f172a;
      line-height: 1;
    }

    .score-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 700;
      margin-top: 3px;
    }

    .stats-card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin: 22px 0 16px;
    }

    .stat-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      transition: transform var(--transition-normal);
      cursor: pointer;
    }

    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
    }

    .stat-card.card-correct { background: #f0fdf4; border-color: #bbf7d0; }
    .stat-card.card-wrong { background: #fef2f2; border-color: #fecaca; }
    .stat-card.card-skipped { background: #fffbeb; border-color: #fde68a; }

    .stat-card-val {
      font-size: 1.6rem;
      font-weight: 900;
      line-height: 1.2;
    }

    .card-correct .stat-card-val { color: #16a34a; }
    .card-wrong .stat-card-val { color: #dc2626; }
    .card-skipped .stat-card-val { color: #d97706; }

    .stat-card-name {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 4px;
    }

    /* Filter Chips */
    .filter-wrapper {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 20px 0 10px;
    }

    .filter-chip {
      padding: 8px 18px;
      border-radius: 30px;
      border: 1.5px solid var(--border-color);
      background: #ffffff;
      color: #475569;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition-normal);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .filter-chip:hover {
      background: #f1f5f9;
      border-color: #94a3b8;
    }

    .filter-chip:focus {
      outline: 2px solid var(--primary);
      outline-offset: 1px;
    }

    .filter-chip.active {
      background: #1e293b;
      color: #ffffff;
      border-color: #1e293b;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    .reset-bar {
      text-align: center;
      margin-top: 14px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .action-sub-btn {
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all var(--transition-normal);
      border: none;
    }

    .btn-redo-all {
      background: #e2e8f0;
      color: #334155;
    }

    .btn-redo-all:hover {
      background: #cbd5e1;
      transform: translateY(-1px);
    }

    .btn-redo-wrong {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fca5a5;
    }

    .btn-redo-wrong:hover {
      background: #fecaca;
      transform: translateY(-1px);
    }

    /* Questions Feed */
    .questions-wrapper {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .q-card {
      background: var(--bg-card);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: var(--radius-md);
      padding: 24px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.07);
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      transition: transform var(--transition-normal), box-shadow var(--transition-normal), border-color var(--transition-normal);
      scroll-margin-top: 170px;
      position: relative;
    }

    .q-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.11);
      border-color: #94a3b8;
    }

    .q-card.highlight-flash {
      animation: flashBorder 1.5s ease;
    }

    @keyframes flashBorder {
      0%, 100% { border-color: rgba(255, 255, 255, 0.85); }
      25%, 75% { border-color: var(--primary); box-shadow: 0 0 16px rgba(198, 40, 40, 0.5); }
    }

    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .q-badge {
      background: #fee2e2;
      color: var(--primary);
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .q-category-tag {
      font-size: 0.82rem;
      color: var(--military-dark);
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 3px 10px;
      border-radius: 6px;
      font-weight: 600;
    }

    .q-title {
      font-size: 1.08rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.55;
      margin-bottom: 18px;
    }

    .opt-container {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .opt-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 13px 16px;
      border-radius: 12px;
      border: 1.5px solid #e2e8f0;
      background: #ffffff;
      cursor: pointer;
      transition: all var(--transition-normal);
      user-select: none;
      font-size: 0.97rem;
      line-height: 1.5;
    }

    .opt-item:hover:not(.disabled) {
      background: #f8fafc;
      border-color: #94a3b8;
      transform: translateX(3px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .opt-item:focus {
      outline: 2px solid var(--primary);
      outline-offset: 1px;
    }

    .opt-badge-letter {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #f1f5f9;
      color: #475569;
      font-weight: 800;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1.5px solid #cbd5e1;
      transition: all var(--transition-fast);
      margin-top: 1px;
    }

    .opt-item.selected {
      background: #f0fdf4;
      border-color: #22c55e;
      color: #14532d;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(34, 197, 94, 0.15);
    }

    .opt-item.selected .opt-badge-letter {
      background: #22c55e;
      color: #ffffff;
      border-color: #16a34a;
    }

    .opt-item.is-correct {
      background: #dcfce7 !important;
      border-color: #22c55e !important;
      color: #14532d !important;
      font-weight: 700;
    }

    .opt-item.is-correct .opt-badge-letter {
      background: #16a34a !important;
      color: #ffffff !important;
      border-color: #15803d !important;
    }

    .opt-item.is-user-wrong {
      background: #fee2e2 !important;
      border-color: #ef4444 !important;
      color: #7f1d1d !important;
      font-weight: 600;
    }

    .opt-item.is-user-wrong .opt-badge-letter {
      background: #dc2626 !important;
      color: #ffffff !important;
      border-color: #b91c1c !important;
    }

    .opt-item.disabled {
      cursor: default;
      pointer-events: none;
      opacity: 0.7;
    }

    /* Explanation Box */
    .explanation-card {
      margin-top: 18px;
      padding: 16px 18px;
      border-radius: 12px;
      background: #f8fafc;
      border-left: 5px solid #22c55e;
      border-top: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      display: none;
      animation: slideInLeft var(--transition-normal);
    }

    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .explanation-card.show {
      display: block;
    }

    .exp-title {
      font-size: 0.92rem;
      font-weight: 800;
      color: #166534;
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 6px;
    }

    .exp-body {
      font-size: 0.94rem;
      color: #334155;
      line-height: 1.6;
    }

    /* Submit Section */
    .submit-cta-panel {
      margin-top: 36px;
      padding: 26px 20px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      animation: fadeInUp 0.5s ease;
    }

    .btn-submit-quiz {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #ffffff;
      font-size: 1.12rem;
      font-weight: 800;
      padding: 16px 42px;
      border: none;
      border-radius: 35px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(198, 40, 40, 0.35);
      transition: all var(--transition-normal);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.3px;
      user-select: none;
    }

    .btn-submit-quiz:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(198, 40, 40, 0.45);
    }

    .btn-submit-quiz:active {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(198, 40, 40, 0.35);
    }

    .btn-submit-quiz:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Modal Dialog */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
      animation: fadeIn var(--transition-normal);
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-dialog {
      background: #ffffff;
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      text-align: center;
      max-height: 90vh;
      overflow-y: auto;
      animation: zoomIn var(--transition-normal) cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes zoomIn {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-icon-badge {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      animation: scaleIn var(--transition-normal);
    }

    @keyframes scaleIn {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-icon-warning { background: #fef3c7; color: #d97706; border: 2px solid #fde68a; }
    .modal-icon-success { background: #dcfce7; color: #16a34a; border: 2px solid #bbf7d0; }

    .modal-heading {
      font-size: 1.35rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .modal-body-text {
      font-size: 0.98rem;
      color: #475569;
      line-height: 1.55;
      margin-bottom: 18px;
    }

    .unanswered-card {
      background: #fffbeb;
      border: 1.5px solid #fef08a;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      text-align: left;
    }

    .unanswered-title {
      font-size: 0.88rem;
      font-weight: 800;
      color: #92400e;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .unanswered-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip-item {
      background: #ffffff;
      color: #b45309;
      border: 1px solid #fcd34d;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition-normal);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      user-select: none;
    }

    .chip-item:hover {
      background: #fef3c7;
      border-color: #f59e0b;
      transform: scale(1.05);
    }

    .modal-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    @media (min-width: 480px) {
      .modal-footer {
        flex-direction: row-reverse;
      }
      .modal-footer button {
        flex: 1;
      }
    }

    .btn-modal {
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all var(--transition-normal);
      user-select: none;
    }

    .btn-modal:hover {
      transform: translateY(-1px);
    }

    .btn-modal:active {
      transform: translateY(0);
    }

    .btn-modal-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-modal-primary:hover {
      background: var(--primary-dark);
      box-shadow: 0 4px 12px rgba(198, 40, 40, 0.3);
    }

    .btn-modal-secondary {
      background: #f1f5f9;
      color: #475569;
    }

    .btn-modal-secondary:hover {
      background: #e2e8f0;
    }

    .btn-modal-success {
      background: var(--military-green);
      color: #ffffff;
    }

    .btn-modal-success:hover {
      background: var(--military-dark);
      box-shadow: 0 4px 12px rgba(46, 125, 50, 0.3);
    }

    /* Loading State */
    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(198, 40, 40, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Mobile Adjustments */
    @media (max-width: 600px) {
      header {
        padding: 24px 14px 20px;
      }

      h1 {
        font-size: 1.4rem;
      }

      .sticky-control-wrapper {
        top: 6px;
      }

      .sticky-control-panel {
        padding: 10px 12px;
      }

      .sticky-stat-group {
        gap: 8px;
      }

      .stat-icon-circle {
        width: 30px;
        height: 30px;
        font-size: 0.75rem;
      }

      .stat-text-label {
        font-size: 0.7rem;
      }

      .stat-text-val {
        font-size: 0.95rem;
      }

      .sticky-actions-group {
        gap: 6px;
      }

      .btn-quick-submit {
        padding: 6px 14px;
        font-size: 0.8rem;
      }

      .btn-toggle-palette {
        padding: 5px 10px;
        font-size: 0.75rem;
      }

      .q-card {
        padding: 16px;
      }

      .q-title {
        font-size: 1rem;
      }

      .opt-item {
        padding: 10px 12px;
        gap: 10px;
      }

      .opt-badge-letter {
        width: 24px;
        height: 24px;
        font-size: 0.8rem;
      }

      .btn-submit-quiz {
        width: 100%;
        font-size: 1rem;
        padding: 14px 24px;
      }

      .modal-dialog {
        padding: 20px 16px;
      }

      .score-donut {
        width: 120px;
        height: 120px;
      }

      .score-donut-hole {
        width: 95px;
        height: 95px;
      }

      .score-number {
        font-size: 2rem;
      }

      .stats-card-grid {
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      }
    }

    /* Tablet Adjustments */
    @media (min-width: 601px) and (max-width: 1024px) {
      .sticky-stat-group {
        gap: 10px;
      }

      .stats-card-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* Print Styles */
    @media print {
      header, .sticky-control-wrapper, .btn-submit-quiz {
        display: none !important;
      }

      .q-card {
        page-break-inside: avoid;
        box-shadow: none;
      }
    }

    /* Focus Visible (Accessibility) */
    *:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    /* Smooth Transitions */
    * {
      transition-property: background-color, border-color, color;
      transition-duration: 0.2s;
      transition-timing-function: ease;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="header-inner">
      <div class="header-top-badge">
        <span class="star-icon">⭐</span>
        <span>Luyện Tập - Nâng Cao Kiến Thức</span>
      </div>
      <h1>Ôn Tập Kiến Thức</h1>
      <p class="header-desc">Các Quân, Binh Chủng QĐND Việt Nam</p>
    </div>
  </header>

  <!-- Main Container -->
  <div class="main-container">
    <!-- Sticky Control Panel -->
    <div class="sticky-control-wrapper">
      <div class="sticky-control-panel">
        <div class="sticky-meta-row">
          <div class="sticky-stat-group">
            <div class="sticky-stat-item">
              <div class="stat-icon-circle">📊</div>
              <div>
                <div class="stat-text-label">Câu Hỏi</div>
                <div class="stat-text-val" id="totalQuestions">0</div>
              </div>
            </div>
            <div class="sticky-stat-item">
              <div class="stat-icon-circle">✅</div>
              <div>
                <div class="stat-text-label">Đã Làm</div>
                <div class="stat-text-val" id="answeredCount">0</div>
              </div>
            </div>
            <div class="sticky-stat-item">
              <div class="stat-icon-circle">🎯</div>
              <div>
                <div class="stat-text-label">Tiến Độ</div>
                <div class="stat-text-val" id="progressPercent">0%</div>
              </div>
            </div>
          </div>

          <div class="sticky-actions-group">
            <button class="btn-quick-submit" id="quickSubmitBtn" aria-label="Nộp bài nhanh">
              📤 Nộp Bài
            </button>
            <button class="btn-toggle-palette" id="togglePaletteBtn" aria-label="Bật tắt bảng điều hướng">
              ▼
            </button>
          </div>
        </div>

        <div class="sticky-progress-track">
          <div class="sticky-progress-fill" id="progressFill"></div>
        </div>

        <div class="sticky-palette-body collapsed" id="paletteBody">
          <div class="palette-legend-bar">
            <span class="legend-tag">
              <div class="legend-dot-sq dot-unanswered"></div>
              Chưa làm
            </span>
            <span class="legend-tag">
              <div class="legend-dot-sq dot-answered"></div>
              Đã chọn
            </span>
            <span class="legend-tag">
              <div class="legend-dot-sq dot-correct"></div>
              Đúng
            </span>
            <span class="legend-tag">
              <div class="legend-dot-sq dot-wrong"></div>
              Sai
            </span>
            <span class="legend-tag">
              <div class="legend-dot-sq dot-skipped"></div>
              Bỏ qua
            </span>
          </div>
          <div class="palette-grid-row" id="paletteGrid"></div>
        </div>
      </div>
    </div>

    <!-- Result Section -->
    <div class="result-section" id="resultSection">
      <div class="result-title-bar">
        <h2 style="margin-bottom: 12px;">🎉 Kết Quả Bài Thi</h2>
        <p class="stat-text-label" id="resultSummary">Câu đúng / Tổng câu</p>
      </div>

      <div class="score-visual-container">
        <div class="score-donut" id="scoreDonut">
          <div class="score-donut-hole">
            <div class="score-number" id="scoreNumber">0</div>
            <div class="score-sub">/ <span id="totalScoreQuestions">0</span></div>
          </div>
        </div>
      </div>

      <div class="stats-card-grid">
        <div class="stat-card card-correct">
          <div class="stat-card-val" id="correctCount">0</div>
          <div class="stat-card-name">Câu Đúng</div>
        </div>
        <div class="stat-card card-wrong">
          <div class="stat-card-val" id="wrongCount">0</div>
          <div class="stat-card-name">Câu Sai</div>
        </div>
        <div class="stat-card card-skipped">
          <div class="stat-card-val" id="skippedCount">0</div>
          <div class="stat-card-name">Bỏ Qua</div>
        </div>
      </div>

      <div class="filter-wrapper">
        <button class="filter-chip active" id="filterAll" aria-label="Xem tất cả">Tất Cả</button>
        <button class="filter-chip" id="filterCorrect" aria-label="Xem câu đúng">✅ Đúng</button>
        <button class="filter-chip" id="filterWrong" aria-label="Xem câu sai">❌ Sai</button>
        <button class="filter-chip" id="filterSkipped" aria-label="Xem câu bỏ qua">⏭️ Bỏ Qua</button>
      </div>

      <div class="reset-bar">
        <button class="action-sub-btn btn-redo-all" id="redoAllBtn">🔄 Làm Lại Tất Cả</button>
        <button class="action-sub-btn btn-redo-wrong" id="redoWrongBtn">🔁 Làm Lại Sai</button>
      </div>
    </div>

    <!-- Questions Feed -->
    <div class="questions-wrapper" id="questionsWrapper"></div>

    <!-- Submit Button -->
    <div class="submit-cta-panel">
      <button class="btn-submit-quiz" id="submitBtn" aria-label="Nộp bài kiểm tra">
        🚀 Nộp Bài & Xem Kết Quả
      </button>
    </div>
  </div>

  <!-- Confetti Canvas -->
  <canvas id="confettiCanvas"></canvas>

  <!-- Modal Backdrop -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-dialog" id="modalDialog">
      <div class="modal-icon-badge modal-icon-warning" id="modalIcon"></div>
      <h3 class="modal-heading" id="modalTitle">Thông Báo</h3>
      <p class="modal-body-text" id="modalBody"></p>
      <div id="unansweredContainer"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <script>
    // Web App functionality will go here
    // Initialize confetti canvas, handle interactions, etc.
    
    console.log('✨ QPAN - Quiz Platform Loaded Successfully');
  </script>
</body>
</html>
