<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <meta name="description" content="Ôn tập kiến thức về các quân, binh chủng QĐND Việt Nam" />
  <meta name="theme-color" content="#c62828" />
  <title>Ôn Tập Kiến Thức: Các Quân, Binh Chủng QĐND Việt Nam</title>
  <style>
    :root {
      --primary: #c62828;
      --primary-dark: #8e0000;
      --primary-light: #ef5350;
      --gold: #ffd600;
      --gold-dark: #c79100;
      --military-green: #2e7d32;
      --military-dark: #1b5e20;
      --military-light: #4caf50;
      --bg-card: rgba(255, 255, 255, 0.96);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
      --shadow-md: 0 8px 24px rgba(0,0,0,0.1);
      --shadow-lg: 0 16px 36px rgba(0,0,0,0.16);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); }
    html { scroll-behavior: smooth; }
    body {
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
      background: linear-gradient(to bottom, rgba(241,245,249,0.86), rgba(226,232,240,0.92));
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    header {
      background: linear-gradient(135deg, rgba(127,0,0,0.94), rgba(183,28,28,0.9) 52%, rgba(27,94,32,0.94)),
                  linear-gradient(90deg, rgba(255,255,255,0.06), rgba(255,255,255,0));
      color: white;
      padding: 34px 16px 28px;
      border-bottom: 3.5px solid var(--gold);
      box-shadow: 0 6px 24px rgba(0,0,0,0.25);
    }

    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .header-top-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255,214,0,0.6);
      background: rgba(0,0,0,0.35);
      padding: 6px 18px;
      border-radius: 999px;
      color: var(--gold);
      font-weight: 800;
      font-size: 0.8rem;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    .star-icon { filter: drop-shadow(0 0 6px rgba(255,214,0,0.85)); }

    h1 {
      font-size: clamp(1.5rem, 2vw, 2.3rem);
      line-height: 1.25;
      font-weight: 900;
      text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    .header-desc {
      font-size: 0.96rem;
      opacity: 0.96;
      max-width: 720px;
      color: #f8fafc;
    }

    .main-container {
      max-width: 960px;
      margin: 20px auto 0;
      padding: 0 16px 90px;
    }

    .sticky-control-wrapper {
      position: sticky;
      top: 10px;
      z-index: 120;
      margin-bottom: 22px;
    }

    .sticky-control-panel {
      background: rgba(255,255,255,0.96);
      border: 1.5px solid rgba(198,40,40,0.25);
      border-radius: var(--radius-md);
      box-shadow: 0 8px 24px rgba(15,23,42,0.14);
      padding: 14px 18px;
    }

    .sticky-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .sticky-stat-group {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .sticky-stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-icon-circle {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    .stat-text-label {
      font-size: 0.76rem;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .stat-text-val {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.2;
    }

    .sticky-actions-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-quick-submit,
    .btn-toggle-palette,
    .btn-submit-quiz,
    .action-sub-btn,
    .filter-chip,
    .btn-modal,
    .chip-item,
    .p-btn,
    .opt-item {
      transition: all 0.2s ease;
      user-select: none;
    }

    .btn-quick-submit {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 8px 18px;
      font-weight: 800;
      font-size: 0.88rem;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(198,40,40,0.3);
    }
    .btn-quick-submit:hover { transform: translateY(-1px); }

    .btn-toggle-palette {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #334155;
      border-radius: 8px;
      padding: 6px 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .sticky-progress-track {
      height: 7px;
      width: 100%;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin: 10px 0;
    }

    .sticky-progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #2e7d32, #43a047, #ffd600);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .sticky-palette-body {
      transition: max-height 0.25s ease, opacity 0.25s ease;
      overflow: hidden;
    }

    .sticky-palette-body.collapsed {
      max-height: 0;
      opacity: 0;
      margin-top: 0;
    }

    .sticky-palette-body:not(.collapsed) {
      max-height: 220px;
      opacity: 1;
    }

    .palette-legend-bar {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
      color: var(--text-muted);
      font-size: 0.78rem;
    }

    .legend-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .legend-dot-sq {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      display: inline-block;
    }

    .dot-unanswered { background: #fff; border: 1px solid #94a3b8; }
    .dot-answered { background: var(--military-green); }
    .dot-correct { background: #16a34a; }
    .dot-wrong { background: #dc2626; }
    .dot-skipped { background: #f59e0b; }

    .palette-grid-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(38px,1fr));
      gap: 6px;
    }

    .p-btn {
      height: 36px;
      border: 1.5px solid #cbd5e1;
      background: #fff;
      color: #334155;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .p-btn:hover { background: #f1f5f9; }
    .p-btn.answered {
      background: linear-gradient(135deg, var(--military-green), #1b5e20);
      color: white;
      border-color: #1b5e20;
    }
    .p-btn.current-target {
      outline: 2.5px solid var(--primary);
      outline-offset: 1px;
    }
    .p-btn.res-correct { background: #16a34a; color: white; border-color: #15803d; }
    .p-btn.res-wrong { background: #dc2626; color: white; border-color: #b91c1c; }
    .p-btn.res-skipped { background: #f59e0b; color: white; border-color: #d97706; }

    .result-section {
      display: none;
      background: rgba(255,255,255,0.98);
      border: 2px solid #22c55e;
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-lg);
      animation: popIn 0.35s ease;
    }
    .result-section.active { display: block; }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.96) translateY(-10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .result-title-bar { text-align: center; margin-bottom: 18px; }

    .score-visual-container {
      display: flex;
      justify-content: center;
      margin: 12px 0 20px;
    }

    .score-donut {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-md);
      background: conic-gradient(#16a34a 0%, #16a34a 0%, #e2e8f0 0%);
      transition: background 0.8s ease;
    }

    .score-donut-hole {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .score-number {
      font-size: 2.3rem;
      font-weight: 900;
      color: #0f172a;
      line-height: 1;
    }

    .score-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 700;
      margin-top: 3px;
    }

    .stats-card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin: 20px 0 18px;
    }

    .stat-card {
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }
    .stat-card.card-correct { background: #f0fdf4; border-color: #bbf7d0; }
    .stat-card.card-wrong { background: #fef2f2; border-color: #fecaca; }
    .stat-card.card-skipped { background: #fffbeb; border-color: #fde68a; }

    .stat-card-val {
      font-size: 1.6rem;
      font-weight: 900;
      line-height: 1.2;
    }
    .card-correct .stat-card-val { color: #16a34a; }
    .card-wrong .stat-card-val { color: #dc2626; }
    .card-skipped .stat-card-val { color: #d97706; }

    .stat-card-name {
      margin-top: 4px;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 600;
    }

    .filter-wrapper {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 20px 0 10px;
    }

    .filter-chip {
      background: white;
      color: #475569;
      border: 1.5px solid var(--border-color);
      border-radius: 30px;
      padding: 8px 18px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
    }
    .filter-chip.active {
      background: #1e293b;
      color: white;
      border-color: #1e293b;
    }

    .reset-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .action-sub-btn {
      border: none;
      border-radius: 30px;
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-redo-all { background: #e2e8f0; color: #334155; }
    .btn-redo-wrong { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }

    .questions-wrapper {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .q-card {
      background: var(--bg-card);
      border: 1.5px solid rgba(255,255,255,0.85);
      border-radius: var(--radius-md);
      padding: 24px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.07);
      scroll-margin-top: 170px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .q-card:hover { box-shadow: 0 10px 28px rgba(0,0,0,0.11); border-color: #94a3b8; }
    .q-card.highlight-flash {
      animation: flashBorder 1.5s ease;
    }

    @keyframes flashBorder {
      0%,100% { border-color: rgba(255,255,255,0.85); }
      25%,75% { border-color: var(--primary); box-shadow: 0 0 16px rgba(198,40,40,0.5); }
    }

    .q-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .q-badge {
      background: #fee2e2;
      color: var(--primary);
      border-radius: 6px;
      padding: 4px 12px;
      font-weight: 800;
      font-size: 0.85rem;
    }

    .q-category-tag {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: var(--military-dark);
      padding: 3px 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.82rem;
    }

    .q-title {
      font-size: 1.08rem;
      line-height: 1.55;
      font-weight: 700;
      margin-bottom: 18px;
      color: #0f172a;
    }

    .opt-container {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .opt-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      background: #fff;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 13px 16px;
      cursor: pointer;
      font-size: 0.97rem;
      line-height: 1.5;
    }
    .opt-item:hover:not(.disabled) {
      background: #f8fafc;
      border-color: #94a3b8;
      transform: translateX(3px);
    }
    .opt-item.selected {
      background: #f0fdf4;
      border-color: #22c55e;
      color: #14532d;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(34,197,94,0.15);
    }
    .opt-item.is-correct {
      background: #dcfce7 !important;
      border-color: #22c55e !important;
      color: #14532d !important;
      font-weight: 700;
    }
    .opt-item.is-user-wrong {
      background: #fee2e2 !important;
      border-color: #ef4444 !important;
      color: #7f1d1d !important;
      font-weight: 600;
    }
    .opt-item.disabled { cursor: default; pointer-events: none; }

    .opt-badge-letter {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #f1f5f9;
      border: 1.5px solid #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 800;
      color: #475569;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .opt-item.selected .opt-badge-letter {
      background: #22c55e;
      border-color: #16a34a;
      color: white;
    }
    .opt-item.is-correct .opt-badge-letter {
      background: #16a34a !important;
      border-color: #15803d !important;
      color: white !important;
    }
    .opt-item.is-user-wrong .opt-badge-letter {
      background: #dc2626 !important;
      border-color: #b91c1c !important;
      color: white !important;
    }

    .explanation-card {
      margin-top: 18px;
      padding: 16px 18px;
      border-radius: 12px;
      background: #f8fafc;
      border-left: 5px solid #22c55e;
      border-top: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      display: none;
    }
    .explanation-card.show { display: block; }

    .exp-title {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 6px;
      font-size: 0.92rem;
      font-weight: 800;
      color: #166534;
    }

    .exp-body {
      font-size: 0.94rem;
      color: #334155;
      line-height: 1.6;
    }

    .submit-cta-panel {
      margin-top: 36px;
      padding: 26px 20px;
      background: rgba(255,255,255,0.95);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      text-align: center;
    }

    .btn-submit-quiz {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      border-radius: 35px;
      padding: 16px 42px;
      font-size: 1.12rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(198,40,40,0.35);
    }
    .btn-submit-quiz:hover { transform: translateY(-2px); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }
    .modal-backdrop.open { display: flex; }

    .modal-dialog {
      background: white;
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      width: min(520px, 100%);
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-icon-badge {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 1.8rem;
    }
    .modal-icon-warning { background: #fef3c7; color: #d97706; border: 2px solid #fde68a; }
    .modal-icon-success { background: #dcfce7; color: #16a34a; border: 2px solid #bbf7d0; }

    .modal-heading {
      text-align: center;
      font-size: 1.35rem;
      margin-bottom: 8px;
      font-weight: 800;
      color: #0f172a;
    }

    .modal-body-text {
      text-align: center;
      color: #475569;
      line-height: 1.55;
      margin-bottom: 18px;
    }

    .unanswered-card {
      margin-bottom: 20px;
      border-radius: 12px;
      background: #fffbeb;
      border: 1.5px solid #fef08a;
      padding: 16px;
      text-align: left;
    }

    .unanswered-title {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #92400e;
      font-size: 0.88rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .unanswered-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip-item {
      border: 1px solid #fcd34d;
      background: white;
      color: #b45309;
      border-radius: 20px;
      padding: 6px 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .chip-item:hover { background: #fef3c7; }

    .modal-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }
    @media (min-width: 480px) {
      .modal-footer { flex-direction: row-reverse; }
      .modal-footer button { flex: 1; }
    }

    .btn-modal {
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-modal-primary { background: var(--primary); color: white; }
    .btn-modal-secondary { background: #f1f5f9; color: #475569; }
    .btn-modal-success { background: var(--military-green); color: white; }

    @media (max-width: 600px) {
      .sticky-stat-group { gap: 10px; }
      .sticky-control-panel { padding: 10px 12px; }
      .stat-icon-circle { width: 30px; height: 30px; }
      .q-card { padding: 16px; }
      .opt-item { padding: 10px 12px; gap: 10px; }
      .opt-badge-letter { width: 24px; height: 24px; }
      .btn-submit-quiz { width: 100%; }
    }
  </style>
</head>
<body>
  <canvas id="confettiCanvas"></canvas>

  <header>
    <div class="header-inner">
      <div class="header-top-badge">
        <span class="star-icon">⭐</span>
        <span>Luyện Tập - Nâng Cao Kiến Thức</span>
      </div>
      <h1>Ôn Tập Kiến Thức</h1>
      <p class="header-desc">Các Quân, Binh Chủng QĐND Việt Nam</p>
    </div>
  </header>

  <div class="main-container">
    <div class="sticky-control-wrapper">
      <div class="sticky-control-panel">
        <div class="sticky-meta-row">
          <div class="sticky-stat-group">
            <div class="sticky-stat-item">
              <div class="stat-icon-circle">📊</div>
              <div>
                <div class="stat-text-label">Câu Hỏi</div>
                <div class="stat-text-val" id="totalQuestions">0</div>
              </div>
            </div>
            <div class="sticky-stat-item">
              <div class="stat-icon-circle">✅</div>
              <div>
                <div class="stat-text-label">Đã Làm</div>
                <div class="stat-text-val" id="answeredCount">0</div>
              </div>
            </div>
            <div class="sticky-stat-item">
              <div class="stat-icon-circle">🎯</div>
              <div>
                <div class="stat-text-label">Tiến Độ</div>
                <div class="stat-text-val" id="progressPercent">0%</div>
              </div>
            </div>
          </div>

          <div class="sticky-actions-group">
            <button class="btn-quick-submit" id="quickSubmitBtn">📤 Nộp Bài</button>
            <button class="btn-toggle-palette" id="togglePaletteBtn">▼</button>
          </div>
        </div>

        <div class="sticky-progress-track">
          <div class="sticky-progress-fill" id="progressFill"></div>
        </div>

        <div class="sticky-palette-body collapsed" id="paletteBody">
          <div class="palette-legend-bar">
            <span class="legend-tag"><span class="legend-dot-sq dot-unanswered"></span>Chưa làm</span>
            <span class="legend-tag"><span class="legend-dot-sq dot-answered"></span>Đã chọn</span>
            <span class="legend-tag"><span class="legend-dot-sq dot-correct"></span>Đúng</span>
            <span class="legend-tag"><span class="legend-dot-sq dot-wrong"></span>Sai</span>
            <span class="legend-tag"><span class="legend-dot-sq dot-skipped"></span>Bỏ qua</span>
          </div>
          <div class="palette-grid-row" id="paletteGrid"></div>
        </div>
      </div>
    </div>

    <div class="result-section" id="resultSection">
      <div class="result-title-bar">
        <h2 style="margin-bottom:12px;">🎉 Kết Quả Bài Thi</h2>
        <p class="stat-text-label" id="resultSummary">0 / 0 câu đúng</p>
      </div>

      <div class="score-visual-container">
        <div class="score-donut" id="scoreDonut">
          <div class="score-donut-hole">
            <div class="score-number" id="scoreNumber">0</div>
            <div class="score-sub">/ <span id="totalScoreQuestions">0</span></div>
          </div>
        </div>
      </div>

      <div class="stats-card-grid">
        <div class="stat-card card-correct">
          <div class="stat-card-val" id="correctCount">0</div>
          <div class="stat-card-name">Câu Đúng</div>
        </div>
        <div class="stat-card card-wrong">
          <div class="stat-card-val" id="wrongCount">0</div>
          <div class="stat-card-name">Câu Sai</div>
        </div>
        <div class="stat-card card-skipped">
          <div class="stat-card-val" id="skippedCount">0</div>
          <div class="stat-card-name">Bỏ Qua</div>
        </div>
      </div>

      <div class="filter-wrapper">
        <button class="filter-chip active" data-filter="all">Tất Cả</button>
        <button class="filter-chip" data-filter="correct">✅ Đúng</button>
        <button class="filter-chip" data-filter="wrong">❌ Sai</button>
        <button class="filter-chip" data-filter="skipped">⏭️ Bỏ Qua</button>
      </div>

      <div class="reset-bar">
        <button class="action-sub-btn btn-redo-all" id="redoAllBtn">🔄 Làm Lại Tất Cả</button>
        <button class="action-sub-btn btn-redo-wrong" id="redoWrongBtn">🔁 Làm Lại Sai</button>
      </div>
    </div>

    <div class="questions-wrapper" id="questionsWrapper"></div>

    <div class="submit-cta-panel">
      <button class="btn-submit-quiz" id="submitBtn">🚀 Nộp Bài & Xem Kết Quả</button>
    </div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-dialog">
      <div class="modal-icon-badge modal-icon-warning" id="modalIcon">⚠️</div>
      <h3 class="modal-heading" id="modalTitle">Thông Báo</h3>
      <p class="modal-body-text" id="modalBody">Bạn chưa hoàn thành hết câu hỏi.</p>
      <div id="unansweredContainer"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <script>
    const questions = [
      {
        id: 1,
        category: 'Lý thuyết chung',
        title: 'Quân đội nhân dân Việt Nam có nhiệm vụ bảo vệ độc lập, chủ quyền, toàn vẹn lãnh thổ và an ninh quốc gia của nước Cộng hòa xã hội chủ nghĩa Việt Nam?',
        options: ['Đúng', 'Sai'],
        answer: 0,
        explanation: 'Quân đội nhân dân Việt Nam là lực lượng vũ trang nhân dân, có nhiệm vụ bảo vệ Tổ quốc, giữ gìn an ninh quốc gia và thực hiện nghĩa vụ quốc phòng.'
      },
      {
        id: 2,
        category: 'Binh chủng',
        title: 'Binh chủng nào là lực lượng chủ lực tiến công, đánh chiếm và phòng ngự trên mặt đất?',
        options: ['Binh chủng bộ binh', 'Binh chủng pháo binh', 'Binh chủng công binh', 'Binh chủng không quân'],
        answer: 0,
        explanation: 'Bộ binh là binh chủng quyết định trực tiếp trên chiến trường mặt đất, thực hiện chiến đấu gần, tiến công và phòng ngự.'
      },
      {
        id: 3,
        category: 'Quân chủng',
        title: 'Binh chủng nào chủ yếu thực hiện nhiệm vụ bắn phá, yểm trợ hỏa lực cho các đơn vị chiến đấu?',
        options: ['Bộ binh', 'Pháo binh', 'Công binh', 'Tăng thiết giáp'],
        answer: 1,
        explanation: 'Pháo binh có nhiệm vụ bắn phá, hỏa lực và hỗ trợ các đơn vị chiến đấu bằng hỏa lực nặng.'
      },
      {
        id: 4,
        category: 'Quân chủng',
        title: 'Lực lượng nào có nhiệm vụ bảo vệ vùng trời, không phận và thực hiện chiến đấu trên không?',
        options: ['Không quân', 'Hải quân', 'Bộ binh', 'Công binh'],
        answer: 0,
        explanation: 'Không quân là quân chủng thực hiện nhiệm vụ trên không, bảo vệ vùng trời và không phận quốc gia.'
      },
      {
        id: 5,
        category: 'Binh chủng',
        title: 'Binh chủng nào thường thực hiện nhiệm vụ đánh dấu, san lấp, sửa chữa, đào hào, mở đường qua địa hình khó khăn?',
        options: ['Công binh', 'Pháo binh', 'Tăng thiết giáp', 'Không quân'],
        answer: 0,
        explanation: 'Công binh là binh chủng chuyên trách về kỹ thuật, đào, sửa đường, mở luồng, xây dựng công sự chiến đấu.'
      },
      {
        id: 6,
        category: 'Quân chủng',
        title: 'Hải quân Việt Nam có nhiệm vụ bảo vệ chủ quyền, an ninh trên biển, đảo và vùng biển của Tổ quốc?',
        options: ['Đúng', 'Sai'],
        answer: 0,
        explanation: 'Hải quân có nhiệm vụ bảo vệ các tuyến biển, đảo, lãnh hải và thực hiện chiến đấu trên biển.'
      },
      {
        id: 7,
        category: 'Binh chủng',
        title: 'Tăng - Thiết giáp chủ yếu được sử dụng cho nhiệm vụ nào sau đây?',
        options: ['Đánh chặn, tấn công, đột phá trên mặt đất', 'Pháo binh yểm hộ', 'Bảo vệ vùng trời', 'Chữa bệnh ở bệnh viện quân y'],
        answer: 0,
        explanation: 'Tăng - thiết giáp có sức mạnh cơ động và hỏa lực lớn, phù hợp cho tấn công, đột phá và đánh chiếm.'
      },
      {
        id: 8,
        category: 'Lý thuyết chung',
        title: 'Binh chủng nào được xem là “mặt trận” trực tiếp chiến đấu trên không gian đất liền, có nhiệm vụ tiêu diệt địch gần chiến tuyến?',
        options: ['Bộ binh', 'Hải quân', 'Phòng không', 'Thuỷ quân lục chiến'],
        answer: 0,
        explanation: 'Bộ binh trực tiếp tham chiến trên mặt đất, đánh gần, bám sát chiến tuyến và chiến đấu trong địa hình thực tế.'
      },
      {
        id: 9,
        category: 'Quân chủng',
        title: 'Quân chủng nào có nhiệm vụ chiến đấu trên biển, bảo vệ chủ quyền biển đảo và thực hiện các nhiệm vụ quân sự ở biển?',
        options: ['Hải quân', 'Không quân', 'Pháo binh', 'Bộ binh'],
        answer: 0,
        explanation: 'Hải quân là quân chủng chuyên trách chiến đấu trên biển, bảo vệ vùng biển và hải đảo.'
      },
      {
        id: 10,
        category: 'Binh chủng',
        title: 'Binh chủng nào tiến hành xây dựng công sự, bãi tập, hầm ngầm và hỗ trợ quân đội trong chiến đấu phòng ngự?',
        options: ['Công binh', 'Pháo binh', 'Thiết giáp', 'Bộ binh'],
        answer: 0,
        explanation: 'Công binh có vai trò rất quan trọng trong xây dựng công sự, kỹ thuật chiến đấu, cứu hộ và đảm bảo đường vận chuyển.'
      },
      {
        id: 11,
        category: 'Lý thuyết chung',
        title: 'Nhiệm vụ của quân đội nhân dân Việt Nam là bảo vệ sự sống còn của dân tộc, chủ quyền và sự ổn định của đất nước?',
        options: ['Đúng', 'Sai'],
        answer: 0,
        explanation: 'Quân đội bảo vệ Tổ quốc, giữ vững an ninh, ổn định chính trị, trật tự xã hội và quyền lợi của nhân dân.'
      },
      {
        id: 12,
        category: 'Quân chủng',
        title: 'Trong quân đội, lực lượng nào có nhiệm vụ phòng không, đánh chặn máy bay, tên lửa của đối phương?',
        options: ['Phòng không', 'Công binh', 'Bộ binh', 'Hải quân'],
        answer: 0,
        explanation: 'Phòng không là lực lượng chuyên trách bảo vệ không phận, phát hiện và đánh chặn các mục tiêu trên không.'
      }
    ];

    const state = {
      selected: new Array(questions.length).fill(null),
      submitted: false,
      filter: 'all',
      currentIndex: 0
    };

    const elements = {
      totalQuestions: document.getElementById('totalQuestions'),
      answeredCount: document.getElementById('answeredCount'),
      progressPercent: document.getElementById('progressPercent'),
      progressFill: document.getElementById('progressFill'),
      paletteGrid: document.getElementById('paletteGrid'),
      questionsWrapper: document.getElementById('questionsWrapper'),
      submitBtn: document.getElementById('submitBtn'),
      quickSubmitBtn: document.getElementById('quickSubmitBtn'),
      togglePaletteBtn: document.getElementById('togglePaletteBtn'),
      paletteBody: document.getElementById('paletteBody'),
      resultSection: document.getElementById('resultSection'),
      resultSummary: document.getElementById('resultSummary'),
      correctCount: document.getElementById('correctCount'),
      wrongCount: document.getElementById('wrongCount'),
      skippedCount: document.getElementById('skippedCount'),
      scoreDonut: document.getElementById('scoreDonut'),
      scoreNumber: document.getElementById('scoreNumber'),
      totalScoreQuestions: document.getElementById('totalScoreQuestions'),
      modalBackdrop: document.getElementById('modalBackdrop'),
      modalTitle: document.getElementById('modalTitle'),
      modalBody: document.getElementById('modalBody'),
      modalFooter: document.getElementById('modalFooter'),
      unansweredContainer: document.getElementById('unansweredContainer'),
      redoAllBtn: document.getElementById('redoAllBtn'),
      redoWrongBtn: document.getElementById('redoWrongBtn')
    };

    function getAnsweredCount() {
      return state.selected.filter(v => v !== null).length;
    }

    function getStats() {
      const correct = state.selected.reduce((count, value, index) => {
        if (value !== null && value === questions[index].answer) return count + 1;
        return count;
      }, 0);

      const wrong = state.selected.reduce((count, value, index) => {
        if (value !== null && value !== questions[index].answer) return count + 1;
        return count;
      }, 0);

      const skipped = questions.length - getAnsweredCount();
      return { correct, wrong, skipped };
    }

    function renderPalette() {
      elements.paletteGrid.innerHTML = '';

      questions.forEach((question, index) => {
        const btn = document.createElement('button');
        btn.className = 'p-btn';
        btn.type = 'button';
        btn.textContent = index + 1;

        const value = state.selected[index];
        const isAnswered = value !== null;
        if (isAnswered) btn.classList.add('answered');
        if (state.submitted) {
          if (value === null) {
            btn.classList.add('res-skipped');
          } else if (value === questions[index].answer) {
            btn.classList.add('res-correct');
          } else {
            btn.classList.add('res-wrong');
          }
        }

        if (state.currentIndex === index && !state.submitted) {
          btn.classList.add('current-target');
        }

        btn.addEventListener('click', () => {
          const card = document.getElementById('q-' + index);
          if (card) {
            card.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
          state.currentIndex = index;
          renderPalette();
          highlightQuestion(index);
        });

        elements.paletteGrid.appendChild(btn);
      });
    }

    function highlightQuestion(index) {
      document.querySelectorAll('.q-card').forEach((card) => card.classList.remove('highlight-flash'));
      const card = document.getElementById('q-' + index);
      if (card) {
        card.classList.add('highlight-flash');
      }
    }

    function updateProgress() {
      const answered = getAnsweredCount();
      const percent = Math.round((answered / questions.length) * 100);
      elements.totalQuestions.textContent = questions.length;
      elements.answeredCount.textContent = answered;
      elements.progressPercent.textContent = percent + '%';
      elements.progressFill.style.width = percent + '%';
    }

    function renderQuestions() {
      elements.questionsWrapper.innerHTML = '';

      questions.forEach((question, index) => {
        const card = document.createElement('div');
        card.className = 'q-card';
        card.id = 'q-' + index;
        card.dataset.state = 'visible';

        const selectedValue = state.selected[index];
        const isCorrect = selectedValue !== null && selectedValue === question.answer;
        const isWrong = selectedValue !== null && selectedValue !== question.answer;

        if (state.filter !== 'all') {
          const visible =
            (state.filter === 'correct' && isCorrect) ||
            (state.filter === 'wrong' && isWrong) ||
            (state.filter === 'skipped' && selectedValue === null && state.submitted);
          card.style.display = visible ? 'block' : 'none';
        }

        const answerHtml = question.options.map((option, optionIndex) => {
          const isSelected = selectedValue === optionIndex;
          const showCorrect = state.submitted && optionIndex === question.answer;
          const showWrong = state.submitted && isSelected && optionIndex !== question.answer;

          let classes = 'opt-item';
          if (isSelected) classes += ' selected';
          if (showCorrect) classes += ' is-correct';
          if (showWrong) classes += ' is-user-wrong';
          if (state.submitted) classes += ' disabled';

          return `
            <button type="button" class="${classes}" data-index="${index}" data-option="${optionIndex}">
              <span class="opt-badge-letter">${String.fromCharCode(65 + optionIndex)}</span>
              <span>${option}</span>
            </button>
          `;
        }).join('');

        const explanationHtml = state.submitted ? `
          <div class="explanation-card show">
            <div class="exp-title">💡 Giải thích</div>
            <div class="exp-body">${question.explanation}</div>
          </div>
        ` : '';

        card.innerHTML = `
          <div class="q-meta">
            <span class="q-badge">Câu ${index + 1}</span>
            <span class="q-category-tag">${question.category}</span>
          </div>
          <div class="q-title">${question.title}</div>
          <div class="opt-container">${answerHtml}</div>
          ${explanationHtml}
        `;

        card.querySelectorAll('.opt-item').forEach((btn) => {
          btn.addEventListener('click', () => {
            const optionIndex = Number(btn.dataset.option);
            state.selected[index] = optionIndex;
            state.currentIndex = index;
            renderQuestions();
            renderPalette();
            updateProgress();
          });
        });

        elements.questionsWrapper.appendChild(card);
      });
    }

    function getUnansweredIndexes() {
      return state.selected
        .map((value, index) => value === null ? index : null)
        .filter(value => value !== null);
    }

    function openModal({ title, body, unansweredIndexes = [] }) {
      elements.modalTitle.textContent = title;
      elements.modalBody.textContent = body;
      elements.modalFooter.innerHTML = '';
      elements.unansweredContainer.innerHTML = '';

      if (unansweredIndexes.length) {
        const card = document.createElement('div');
        card.className = 'unanswered-card';
        card.innerHTML = `
          <div class="unanswered-title">📌 Câu chưa làm</div>
          <div class="unanswered-chips">
            ${unansweredIndexes.map(index => `<button type="button" class="chip-item" data-jump="${index}">Câu ${index + 1}</button>`).join('')}
          </div>
        `;
        elements.unansweredContainer.appendChild(card);

        card.querySelectorAll('.chip-item').forEach((chip) => {
          chip.addEventListener('click', () => {
            const jumpIndex = Number(chip.dataset.jump);
            const targetCard = document.getElementById('q-' + jumpIndex);
            if (targetCard) {
              targetCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
              state.currentIndex = jumpIndex;
              renderPalette();
              highlightQuestion(jumpIndex);
            }
            closeModal();
          });
        });
      }

      const confirmBtn = document.createElement('button');
      confirmBtn.type = 'button';
      confirmBtn.className = 'btn-modal btn-modal-primary';
      confirmBtn.textContent = unansweredIndexes.length ? 'Tiếp tục làm' : 'Đồng ý';
      confirmBtn.addEventListener('click', closeModal);
      elements.modalFooter.appendChild(confirmBtn);

      if (unansweredIndexes.length) {
        const submitBtn = document.createElement('button');
        submitBtn.type = 'button';
        submitBtn.className = 'btn-modal btn-modal-success';
        submitBtn.textContent = 'Nộp bài';
        submitBtn.addEventListener('click', () => {
          closeModal();
          submitQuiz();
        });
        elements.modalFooter.appendChild(submitBtn);
      }

      elements.modalBackdrop.classList.add('open');
    }

    function closeModal() {
      elements.modalBackdrop.classList.remove('open');
    }

    function computeResults() {
      const stats = getStats();
      const total = questions.length;
      const percent = total ? Math.round((stats.correct / total) * 100) : 0;
      return { ...stats, total, percent };
    }

    function updateResultPanel() {
      const result = computeResults();
      elements.resultSummary.textContent = `${result.correct} / ${result.total} câu đúng`;
      elements.correctCount.textContent = result.correct;
      elements.wrongCount.textContent = result.wrong;
      elements.skippedCount.textContent = result.skipped;
      elements.totalScoreQuestions.textContent = result.total;
      elements.scoreNumber.textContent = result.correct;
      elements.scoreDonut.style.background = `conic-gradient(#16a34a 0 ${result.percent}%, #e2e8f0 ${result.percent}% 100%)`;
    }

    function submitQuiz() {
      const unanswered = getUnansweredIndexes();
      if (unanswered.length) {
        openModal({
          title: 'Bạn còn câu chưa làm!',
          body: 'Hãy hoàn thành tất cả các câu hỏi trước khi nộp bài.',
          unansweredIndexes: unanswered
        });
        return;
      }

      state.submitted = true;
      updateResultPanel();
      elements.resultSection.classList.add('active');
      renderQuestions();
      renderPalette();
      document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
      triggerConfetti();
    }

    function resetQuiz() {
      state.selected = new Array(questions.length).fill(null);
      state.submitted = false;
      state.filter = 'all';
      state.currentIndex = 0;
      elements.resultSection.classList.remove('active');
      document.querySelectorAll('.filter-chip').forEach(chip => {
        chip.classList.toggle('active', chip.dataset.filter === 'all');
      });
      renderQuestions();
      renderPalette();
      updateProgress();
    }

    function redoWrongAnswers() {
      state.selected = state.selected.map((value, index) => {
        if (value === null) return null;
        return value === questions[index].answer ? value : null;
      });
      state.submitted = false;
      state.filter = 'all';
      renderQuestions();
      renderPalette();
      updateProgress();
      document.querySelectorAll('.filter-chip').forEach(chip => chip.classList.toggle('active', chip.dataset.filter === 'all'));
    }

    function attachFilterEvents() {
      document.querySelectorAll('.filter-chip').forEach((chip) => {
        chip.addEventListener('click', () => {
          state.filter = chip.dataset.filter;
          document.querySelectorAll('.filter-chip').forEach(item => item.classList.toggle('active', item === chip));
          renderQuestions();
        });
      });
    }

    document.getElementById('togglePaletteBtn').addEventListener('click', () => {
      elements.paletteBody.classList.toggle('collapsed');
    });

    elements.submitBtn.addEventListener('click', submitQuiz);
    elements.quickSubmitBtn.addEventListener('click', submitQuiz);
    elements.redoAllBtn.addEventListener('click', resetQuiz);
    elements.redoWrongBtn.addEventListener('click', redoWrongAnswers);
    elements.modalBackdrop.addEventListener('click', (e) => {
      if (e.target === elements.modalBackdrop) closeModal();
    });

    function triggerConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      const ctx = canvas.getContext('2d');
      const particles = [];
      const colors = ['#ef4444', '#f59e0b', '#22c55e', '#3b82f6', '#a855f7', '#facc15'];

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      for (let i = 0; i < 100; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 12,
          vy: (Math.random() - 0.5) * 12 - 3,
          size: Math.random() * 6 + 3,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 100,
          gravity: 0.12
        });
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach((p, i) => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.life -= 1;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.size, p.size);
        });
        for (let i = particles.length - 1; i >= 0; i--) {
          if (particles[i].life <= 0) particles.splice(i, 1);
        }
        if (particles.length > 0) requestAnimationFrame(draw);
      }

      draw();
    }

    attachFilterEvents();
    renderQuestions();
    renderPalette();
    updateProgress();
  </script>
</body>
</html>
